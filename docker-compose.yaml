services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5103
    restart: always

  oauth:
    build:
      context: ./OAuthIntegration
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:5181
      ASPNETCORE_Kestrel__Certificates__Default__Password: password123
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
    volumes:
      - /home/ec2-user/httpsBackEndKey:/https:ro
    ports:
      - "5181:5181"
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api/v1" # Maps to backend:5103/api/v1
        VITE_API_URL_BASIC: "/backend" # Maps to backend:5103
        # Can't use nginx forward, it says redirect URI, fix laters when releases
        VITE_API_GOOGLE_AUTH_API: "https://ec2-13-239-242-173.ap-southeast-2.compute.amazonaws.com:5181/api/v1/Auth/Login/Google?returnUrl=https://ec2-13-239-242-173.ap-southeast-2.compute.amazonaws.com/login"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - oauth
    restart: always
