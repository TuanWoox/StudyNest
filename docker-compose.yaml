version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5103
    ports:
      - "5103:5103"
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_RETURN_URL=http://localhost:80/login
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
